<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050508">
    <meta name="description" content="J.A.R.V.I.S. Command Center">
    <title>J.A.R.V.I.S.</title>
    <style>
        :root {
            --bg: #050508;
            --panel: rgba(26, 26, 26, 0.65);
            --cyan: #00f2ff;
            --cyan-glow: rgba(0, 242, 255, 0.25);
            --amber: #ffb300;
            --text: #e0e6ed;
            --muted: #8892b0;
            --border: rgba(0, 242, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg) url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><rect fill="%23121212" width="30" height="30"/><path stroke="%23303030" stroke-width="0.5" d="M0 0h30v30H0Z" opacity="0.3"/></svg>');
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(8px);
            flex-shrink: 0;
        }

        .system-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--cyan);
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        .system-status {
            font-size: 0.75rem;
            color: var(--amber);
            letter-spacing: 1px;
        }

        .main-container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            width: 240px;
            border-right: 1px solid var(--border);
            background: var(--panel);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--cyan);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .btn {
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            text-align: left;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .btn:active {
            background: var(--cyan-glow);
            border-color: var(--cyan);
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(5, 5, 8, 0.4);
            min-width: 0;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.jarvis {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 3px solid var(--cyan);
        }

        .message.user {
            align-self: flex-end;
            background: rgba(0, 242, 255, 0.08);
            border: 1px solid rgba(0, 242, 255, 0.25);
        }

        .chat-input-area {
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            background: rgba(5, 5, 8, 0.95);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 10px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--cyan);
            box-shadow: inset 0 0 6px var(--cyan-glow);
        }

        .status-panel {
            width: 280px;
            border-left: 1px solid var(--border);
            background: var(--panel);
            backdrop-filter: blur(8px);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .status-card {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
        }

        .status-card-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .status-card-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text);
        }

        @media (max-width: 1024px) {
            .sidebar { width: 200px; }
            .status-panel { width: 240px; }
        }

        @media (max-width: 768px) {
            .sidebar, .status-panel { display: none; }
            .message { max-width: 90%; }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 255, 0.15);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 242, 255, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <div class="system-title">J.A.R.V.I.S. // CORE</div>
        <div class="system-status">OPERATIONAL</div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="panel-title">Modes</div>
            <button class="btn" onclick="setMode('Personal')">Personal</button>
            <button class="btn" onclick="setMode('Work')">Work</button>
            <button class="btn" onclick="setMode('Business')">Business</button>
            <button class="btn" onclick="setMode('Family')">Family</button>
        </aside>

        <main class="chat-panel">
            <div class="chat-messages" id="chat">
                <div class="message jarvis">Systems operational. Ready to assist.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="input" placeholder="Command..." onkeypress="handleKey(event)">
                <button class="btn" onclick="send()">Send</button>
            </div>
        </main>

        <aside class="status-panel">
            <div class="panel-title">Status</div>
            <div class="status-card">
                <div class="status-card-header"><span>System</span><span style="color: var(--cyan);">Online</span></div>
                <div class="status-card-value">All Systems</div>
            </div>
            <div class="status-card">
                <div class="status-card-header"><span>Priority</span></div>
                <div class="status-card-value" style="font-size: 0.95rem;">Family First</div>
            </div>
            <div class="status-card">
                <div class="status-card-header"><span>Latency</span></div>
                <div class="status-card-value">8ms</div>
            </div>
        </aside>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        function send() {
            const text = input.value.trim();
            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chat.appendChild(userMsg);

            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                const jarvisMsg = document.createElement('div');
                jarvisMsg.className = 'message jarvis';
                jarvisMsg.textContent = 'Command acknowledged. Processing...';
                chat.appendChild(jarvisMsg);
                chat.scrollTop = chat.scrollHeight;
            }, 300);
        }

        function handleKey(e) {
            if (e.key === 'Enter') send();
        }

        function setMode(mode) {
            const msg = document.createElement('div');
            msg.className = 'message jarvis';
            msg.textContent = `Mode: ${mode}`;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        input.focus();
    </script>
</body>
</html>
